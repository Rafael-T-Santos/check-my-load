server {
    listen 80;
    listen 443 ssl;

    # Caminho dos certificados que vamos gerar no Docker
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Roteamento do Frontend (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html NUNCA pode ficar em cache. O Vite gera o JS com hash no nome
    # (index-<hash>.js), portanto cada versão tem URL própria e o bundle novo
    # nunca é confundido com o antigo — mas quem aponta para ele é este ficheiro.
    # Um telemóvel que guarde um index.html velho continua a carregar o bundle
    # velho para sempre, e nenhum deploy o alcança: era preciso pedir recarga
    # forçada aparelho a aparelho. Com a conferência, isso significaria manter
    # gente a trabalhar com a versão que sobrescreve a contagem dos colegas.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy para o Backend
    location /api-local/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
